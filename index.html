<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Theatre Booking</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

<div class="bg-white p-6 rounded-xl w-full max-w-md shadow-xl">

<h1 class="text-xl font-bold mb-4 text-center">🎭 Booking</h1>

<select id="show" class="w-full p-2 border mb-2">
  <option value="">Show</option>
  <option>Hamlet</option>
</select>

<select id="time" class="w-full p-2 border mb-2">
  <option value="">Time</option>
  <option>18:00</option>
</select>

<select id="type" class="w-full p-2 border mb-2">
  <option value="">Type</option>
  <option value="adult">Adult $15</option>
  <option value="kid">Kid $8</option>
</select>

<div id="seats" class="grid grid-cols-5 gap-2 mb-3"></div>

<div id="total" class="font-bold text-center mb-2"></div>

<button id="book" class="w-full bg-purple-600 text-white p-2 rounded">
  Book Now
</button>

<div id="msg" class="text-center mt-3 font-bold"></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// 🔥 YOUR CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyDeanKcppyEQVFiYEPLe68FvN4ozn38-A0",
  authDomain: "theatre-booking-system-d45a7.firebaseapp.com",
  projectId: "theatre-booking-system-d45a7",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let selected = [];

// seats
const seatsDiv = document.getElementById("seats");

for (let i = 1; i <= 10; i++) {
  const s = document.createElement("div");
  s.textContent = i;
  s.className = "p-2 bg-gray-300 text-center rounded cursor-pointer";

  s.onclick = () => {
    if (selected.includes(i)) {
      selected = selected.filter(x => x !== i);
      s.classList.remove("bg-green-500","text-white");
    } else {
      selected.push(i);
      s.classList.add("bg-green-500","text-white");
    }
    updateTotal();
  };

  seatsDiv.appendChild(s);
}

// total
function updateTotal() {
  const type = document.getElementById("type").value;
  const price = type === "adult" ? 15 : type === "kid" ? 8 : 0;
  document.getElementById("total").textContent =
    selected.length ? "Total: $" + (price * selected.length) : "";
}

document.getElementById("type").onchange = updateTotal;

// BOOK (DEBUG VERSION)
document.getElementById("book").onclick = async () => {
  const show = document.getElementById("show").value;
  const time = document.getElementById("time").value;
  const type = document.getElementById("type").value;

  if (!show || !time || !type || selected.length === 0) {
    document.getElementById("msg").textContent = "❌ Fill everything";
    return;
  }

  try {
    for (let seat of selected) {
      await addDoc(collection(db, "bookings"), {
        show,
        time,
        type,
        seat
      });
    }

    document.getElementById("msg").textContent = "✅ BOOKED SUCCESSFULLY";

  } catch (error) {
    console.error("FIREBASE ERROR:", error);
    document.getElementById("msg").textContent = "❌ ERROR: " + error.message;
  }
};
</script>

</body>
</html>
