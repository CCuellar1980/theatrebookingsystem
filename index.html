<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Theatre Booking</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-purple-600 via-pink-500 to-orange-400 flex items-center justify-center p-4">

<div class="w-full max-w-2xl bg-white rounded-3xl shadow-2xl p-8">

  <h1 class="text-3xl font-extrabold text-center mb-4">🎭 Theatre Booking</h1>

  <div class="grid md:grid-cols-3 gap-4 mb-6">
    <select id="show" class="p-3 border rounded-xl">
      <option value="">Show</option>
      <option>Hamlet</option>
      <option>The Lion King</option>
      <option>Phantom</option>
    </select>

    <select id="time" class="p-3 border rounded-xl">
      <option value="">Time</option>
      <option>18:00</option>
      <option>20:00</option>
    </select>

    <select id="type" class="p-3 border rounded-xl">
      <option value="">Type</option>
      <option value="adult">Adult $15</option>
      <option value="kid">Kid $8</option>
    </select>
  </div>

  <div id="seats" class="grid grid-cols-5 gap-2 mb-4"></div>
  <div id="total" class="text-center font-bold mb-2"></div>

  <button id="book" class="w-full bg-purple-600 text-white p-3 rounded-xl">Book Now</button>

  <div id="msg" class="text-center mt-3 font-bold"></div>

  <ul id="list" class="mt-6 space-y-2"></ul>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDeanKcppyEQVFiYEPLe68FvN4ozn38-A0",
  authDomain: "theatre-booking-system-d45a7.firebaseapp.com",
  projectId: "theatre-booking-system-d45a7",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let selected = [];

// seats
const seatsDiv = document.getElementById("seats");
for (let i = 1; i <= 15; i++) {
  const s = document.createElement("div");
  s.textContent = i;
  s.className = "p-3 bg-gray-200 text-center rounded cursor-pointer";

  s.onclick = () => {
    if (s.classList.contains("bg-red-400")) return;

    if (selected.includes(i)) {
      selected = selected.filter(x => x !== i);
      s.classList.remove("bg-green-500","text-white");
    } else {
      selected.push(i);
      s.classList.add("bg-green-500","text-white");
    }
    updateTotal();
  };

  seatsDiv.appendChild(s);
}

// total
function updateTotal() {
  const type = document.getElementById("type").value;
  const price = type === "adult" ? 15 : type === "kid" ? 8 : 0;
  document.getElementById("total").textContent =
    selected.length ? "Total: $" + (price * selected.length) : "";
}

document.getElementById("type").onchange = updateTotal;

// load bookings
async function load() {
  const snap = await getDocs(collection(db, "bookings"));
  const list = document.getElementById("list");
  list.innerHTML = "";

  let booked = [];

  snap.forEach(d => {
    const b = d.data();

    list.innerHTML += `<li>${b.show} | ${b.time} | ${b.type} | seat ${b.seat}</li>`;

    if (
      b.show === document.getElementById("show").value &&
      b.time === document.getElementById("time").value
    ) {
      booked.push(b.seat);
    }
  });

  // lock seats
  document.querySelectorAll("#seats div").forEach((s, i) => {
    const num = i + 1;
    s.classList.remove("bg-red-400");

    if (booked.includes(num)) {
      s.classList.add("bg-red-400");
    }
  });
}

// BOOK (SUPER SIMPLE + WORKING)
document.getElementById("book").onclick = async () => {
  const show = document.getElementById("show").value;
  const time = document.getElementById("time").value;
  const type = document.getElementById("type").value;

  if (!show || !time || !type || selected.length === 0) {
    document.getElementById("msg").textContent = "Fill everything";
    return;
  }

  const price = type === "adult" ? 15 : 8;

  for (let seat of selected) {
    await addDoc(collection(db, "bookings"), {
      show,
      time,
      type,
      seat,
      price
    });
  }

  document.getElementById("msg").textContent = "Booked!";

  selected = [];
  document.querySelectorAll("#seats div").forEach(s =>
    s.classList.remove("bg-green-500","text-white")
  );

  updateTotal();
  load();
};

document.getElementById("show").onchange = load;
document.getElementById("time").onchange = load;

load();
</script>

</body>
</html>
